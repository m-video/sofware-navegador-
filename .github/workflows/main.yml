name: Build NOVA Browser APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare HTML and Convert to Android Project
        run: |
          mkdir -p www
          
          # Buscar cualquier archivo HTML en el repositorio y copiarlo a www/index.html
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          elif [ ! -f "www/index.html" ]; then
            HTML_FILE=$(find . -maxdepth 2 -name "*.html" | head -n 1)
            if [ -n "$HTML_FILE" ]; then
              cp "$HTML_FILE" www/index.html
            else
              # Si aun no subiste el HTML, genera NOVA Browser automaticamente para no fallar
              cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>NOVA Browser</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
              body { display: flex; flex-direction: column; height: 100vh; background: #11111b; color: #fff; }
              .bar { display: flex; gap: 6px; padding: 8px; background: #181825; }
              input { flex: 1; padding: 8px 12px; border-radius: 16px; border: 1px solid #313244; background: #1e1e2e; color: #fff; outline: none; }
              button { padding: 8px 14px; border-radius: 16px; border: none; background: #89b4fa; color: #11111b; font-weight: bold; cursor: pointer; }
              iframe { flex: 1; width: 100%; border: none; background: #fff; }
            </style>
          </head>
          <body>
            <div class="bar">
              <button onclick="history.back()">&#8592;</button>
              <input id="u" value="https://es.wikipedia.org" placeholder="URL o buscar...">
              <button onclick="ir()">Ir</button>
              <button onclick="window.location.href=document.getElementById('u').value">&#8599;</button>
            </div>
            <iframe id="f" src="https://es.wikipedia.org"></iframe>
            <script>
              function ir() {
                let v = document.getElementById('u').value.trim();
                if (!v.startsWith('http')) v = v.includes('.') ? 'https://' + v : 'https://www.bing.com/search?q=' + encodeURIComponent(v);
                document.getElementById('u').value = v;
                document.getElementById('f').src = v;
              }
            </script>
          </body>
          </html>
          EOF
            fi
          fi

          # Inicializar Capacitor limpiamente
          rm -rf node_modules package.json package-lock.json capacitor.config.* android
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "NOVA Browser" "com.nova.browser" --web-dir www
          npx cap add android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml

      - name: Accept Android Licenses and Build APK
        working-directory: ./android
        run: |
          SDK_MGR=$(find $ANDROID_HOME -name "sdkmanager" | head -n 1)
          yes | $SDK_MGR --licenses > /dev/null 2>&1 || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Browser-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
