name: Build NOVA Browser APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Compile Pure Native NOVA APK
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Pure Android Browser Project (Zero Capacitor / Zero Chrome)
        run: |
          mkdir -p nova-app/app/src/main/java/com/nova/browser
          mkdir -p nova-app/app/src/main/assets/www
          mkdir -p nova-app/app/src/main/res/values

          # Copiar tu HTML al motor interno de la app
          if [ -f "index.html" ]; then
            cp index.html nova-app/app/src/main/assets/www/index.html
          elif [ -f "www/index.html" ]; then
            cp www/index.html nova-app/app/src/main/assets/www/index.html
          else
            cat << 'EOF' > nova-app/app/src/main/assets/www/index.html
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>NOVA Browser</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
              body { background: #11111b; color: #cdd6f4; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
              h1 { font-size: 44px; color: #89b4fa; margin-bottom: 24px; letter-spacing: 2px; }
              form { display: flex; width: 100%; max-width: 500px; gap: 8px; margin-bottom: 30px; }
              input { flex: 1; padding: 14px 18px; border-radius: 24px; border: 1px solid #313244; background: #1e1e2e; color: #fff; font-size: 15px; outline: none; }
              button { padding: 0 22px; border-radius: 24px; border: none; background: #89b4fa; color: #11111b; font-weight: bold; cursor: pointer; }
              .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 500px; }
              a { background: #1e1e2e; border: 1px solid #313244; padding: 16px; border-radius: 14px; text-align: center; color: #fff; text-decoration: none; font-weight: bold; }
              a:active { background: #313244; }
            </style>
          </head>
          <body>
            <h1>NOVA</h1>
            <form onsubmit="ir(event)">
              <input id="q" placeholder="Buscar en Google o escribir URL...">
              <button type="submit">Ir</button>
            </form>
            <div class="grid">
              <a href="https://m.youtube.com">▶️ YouTube</a>
              <a href="https://www.google.com">🔍 Google</a>
              <a href="https://www.twitch.tv">🟣 Twitch</a>
              <a href="https://www.reddit.com">🟠 Reddit</a>
              <a href="https://es.wikipedia.org">📚 Wikipedia</a>
              <a href="https://duckduckgo.com">🦆 DuckDuckGo</a>
            </div>
            <script>
              function ir(e) {
                e.preventDefault();
                let v = document.getElementById('q').value.trim();
                if (!v) return;
                if (v.startsWith('http://') || v.startsWith('https://')) window.location.href = v;
                else if (v.includes('.') && !v.includes(' ')) window.location.href = 'https://' + v;
                else window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(v);
              }
            </script>
          </body>
          </html>
          EOF
          fi

          # 1. settings.gradle
          cat << 'EOF' > nova-app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NOVABrowser"
          include ':app'
          EOF

          # 2. build.gradle (Raiz)
          cat << 'EOF' > nova-app/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > nova-app/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          # 4. app/build.gradle (Compatible con cualquier BlueStacks Android 5.0 a 14)
          cat << 'EOF' > nova-app/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nova.browser'
              compileSdk 34

              defaultConfig {
                  applicationId "com.nova.browser.standalone"
                  minSdk 21
                  targetSdk 33
                  versionCode 2
                  versionName "2.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > nova-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_compass"
                  android:label="NOVA Browser"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|screenLayout|uiMode"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. Motor propio MainActivity.java (Bloquea redirecciones a Chrome y abre todo adentro)
          cat << 'EOF' > nova-app/app/src/main/java/com/nova/browser/MainActivity.java
          package com.nova.browser;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Message;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.inputmethod.EditorInfo;
          import android.view.inputmethod.InputMethodManager;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;

          public class MainActivity extends Activity {
              private WebView webView;
              private EditText urlInput;
              private ProgressBar progressBar;
              private FrameLayout fullscreenContainer;
              private View customView;
              private WebChromeClient.CustomViewCallback customViewCallback;
              private static final String HOME_URL = "file:///android_asset/www/index.html";

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density);
              }

              private Button crearBoton(String texto, int bgColor, int textColor, int anchoDp) {
                  Button b = new Button(this);
                  b.setText(texto);
                  b.setTextColor(textColor);
                  b.setTextSize(14);
                  b.setPadding(0, 0, 0, 0);
                  GradientDrawable shape = new GradientDrawable();
                  shape.setCornerRadius(dp(18));
                  shape.setColor(bgColor);
                  b.setBackground(shape);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(anchoDp), dp(38));
                  lp.setMargins(dp(3), 0, dp(3), 0);
                  b.setLayoutParams(lp);
                  return b;
              }

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  FrameLayout rootWrapper = new FrameLayout(this);

                  LinearLayout mainLayout = new LinearLayout(this);
                  mainLayout.setOrientation(LinearLayout.VERTICAL);
                  mainLayout.setBackgroundColor(Color.parseColor("#11111b"));

                  // Barra superior de NOVA Browser
                  LinearLayout toolbar = new LinearLayout(this);
                  toolbar.setOrientation(LinearLayout.HORIZONTAL);
                  toolbar.setGravity(Gravity.CENTER_VERTICAL);
                  toolbar.setBackgroundColor(Color.parseColor("#181825"));
                  toolbar.setPadding(dp(6), dp(6), dp(6), dp(6));

                  Button backBtn = crearBoton("←", Color.parseColor("#313244"), Color.WHITE, 38);
                  Button fwdBtn = crearBoton("→", Color.parseColor("#313244"), Color.WHITE, 38);
                  Button reloadBtn = crearBoton("↻", Color.parseColor("#313244"), Color.WHITE, 38);
                  Button homeBtn = crearBoton("🏠", Color.parseColor("#313244"), Color.WHITE, 38);

                  urlInput = new EditText(this);
                  urlInput.setHint("Buscar o escribir URL...");
                  urlInput.setHintTextColor(Color.parseColor("#6c7086"));
                  urlInput.setTextColor(Color.WHITE);
                  urlInput.setSingleLine(true);
                  urlInput.setTextSize(14);
                  urlInput.setImeOptions(EditorInfo.IME_ACTION_GO);
                  GradientDrawable urlBg = new GradientDrawable();
                  urlBg.setCornerRadius(dp(18));
                  urlBg.setColor(Color.parseColor("#1e1e2e"));
                  urlBg.setStroke(dp(1), Color.parseColor("#45475a"));
                  urlInput.setBackground(urlBg);
                  urlInput.setPadding(dp(14), 0, dp(14), 0);
                  LinearLayout.LayoutParams urlParams = new LinearLayout.LayoutParams(0, dp(38), 1f);
                  urlParams.setMargins(dp(4), 0, dp(4), 0);
                  urlInput.setLayoutParams(urlParams);

                  Button goBtn = crearBoton("Ir", Color.parseColor("#89b4fa"), Color.parseColor("#11111b"), 46);

                  toolbar.addView(backBtn);
                  toolbar.addView(fwdBtn);
                  toolbar.addView(reloadBtn);
                  toolbar.addView(homeBtn);
                  toolbar.addView(urlInput);
                  toolbar.addView(goBtn);

                  progressBar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progressBar.setLayoutParams(new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(3)));
                  progressBar.setMax(100);

                  webView = new WebView(this);
                  webView.setLayoutParams(new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setBuiltInZoomControls(true);
                  s.setDisplayZoomControls(false);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  // Permite capturar target="_blank" adentro del mismo navegador sin lanzar Chrome
                  s.setSupportMultipleWindows(true);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setUserAgentString("Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36");

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(webView, true);

                  // Interceptor estricto: NUNCA abre Chrome ni apps externas
                  WebViewClient internalClient = new WebViewClient() {
                      private boolean cargarAdentro(WebView view, String url) {
                          if (url == null) return true;
                          if (url.startsWith("http://") || url.startsWith("https://") || url.startsWith("file://")) {
                              view.loadUrl(url);
                              return true; // Fuerza carga interna en NOVA Browser
                          }
                          // Si YouTube o un sitio intenta forzar abrir otra app con intent://, extrae el link web y lo carga adentro
                          if (url.startsWith("intent://")) {
                              int idx = url.indexOf("S.browser_fallback_url=");
                              if (idx != -1) {
                                  String fallback = url.substring(idx + 23);
                                  int end = fallback.indexOf(";");
                                  if (end != -1) fallback = fallback.substring(0, end);
                                  view.loadUrl(Uri.decode(fallback));
                                  return true;
                              }
                          }
                          if (url.startsWith("vnd.youtube:")) {
                              view.loadUrl("https://m.youtube.com");
                              return true;
                          }
                          return true; // Bloquea cualquier intento de salir de NOVA Browser
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return cargarAdentro(view, url);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return cargarAdentro(view, request.getUrl().toString());
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          if (url.startsWith("file://")) {
                              urlInput.setText("");
                          } else {
                              urlInput.setText(url);
                          }
                      }
                  };

                  webView.setWebViewClient(internalClient);

                  fullscreenContainer = new FrameLayout(this);
                  fullscreenContainer.setBackgroundColor(Color.BLACK);
                  fullscreenContainer.setVisibility(View.GONE);

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          progressBar.setProgress(newProgress);
                          progressBar.setVisibility(newProgress == 100 ? View.GONE : View.VISIBLE);
                      }

                      // Captura cualquier enlace target="_blank" y lo abre adentro del mismo WebView (no en Chrome)
                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                          WebView tempWebView = new WebView(MainActivity.this);
                          tempWebView.setWebViewClient(new WebViewClient() {
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView v, String url) {
                                  webView.loadUrl(url);
                                  return true;
                              }
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest req) {
                                  webView.loadUrl(req.getUrl().toString());
                                  return true;
                              }
                          });
                          WebView.WebViewTransport transport = (WebView.WebViewTransport) resultMsg.obj;
                          transport.setWebView(tempWebView);
                          resultMsg.sendToTarget();
                          return true;
                      }

                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          customView = view;
                          customViewCallback = callback;
                          fullscreenContainer.addView(view);
                          fullscreenContainer.setVisibility(View.VISIBLE);
                          mainLayout.setVisibility(View.GONE);
                      }

                      @Override
                      public void onHideCustomView() {
                          if (customView != null) {
                              fullscreenContainer.removeView(customView);
                              customView = null;
                          }
                          fullscreenContainer.setVisibility(View.GONE);
                          mainLayout.setVisibility(View.VISIBLE);
                          if (customViewCallback != null) customViewCallback.onCustomViewHidden();
                      }
                  });

                  backBtn.setOnClickListener(v -> { if (webView.canGoBack()) webView.goBack(); });
                  fwdBtn.setOnClickListener(v -> { if (webView.canGoForward()) webView.goForward(); });
                  reloadBtn.setOnClickListener(v -> webView.reload());
                  homeBtn.setOnClickListener(v -> webView.loadUrl(HOME_URL));
                  goBtn.setOnClickListener(v -> navegar(urlInput.getText().toString()));

                  urlInput.setOnEditorActionListener((v, actionId, event) -> {
                      if (actionId == EditorInfo.IME_ACTION_GO || actionId == EditorInfo.IME_ACTION_DONE ||
                          (event != null && event.getKeyCode() == KeyEvent.KEYCODE_ENTER)) {
                          navegar(urlInput.getText().toString());
                          return true;
                      }
                      return false;
                  });

                  mainLayout.addView(toolbar);
                  mainLayout.addView(progressBar);
                  mainLayout.addView(webView);

                  rootWrapper.addView(mainLayout);
                  rootWrapper.addView(fullscreenContainer);
                  setContentView(rootWrapper);

                  webView.loadUrl(HOME_URL);
              }

              private void navegar(String texto) {
                  String q = texto.trim();
                  if (q.isEmpty()) return;
                  String destino;
                  if (q.startsWith("http://") || q.startsWith("https://") || q.startsWith("file://")) {
                      destino = q;
                  } else if (q.contains(".") && !q.contains(" ")) {
                      destino = "https://" + q;
                  } else {
                      destino = "https://www.google.com/search?q=" + Uri.encode(q);
                  }
                  InputMethodManager imm = (InputMethodManager) getSystemService(INPUT_METHOD_SERVICE);
                  if (imm != null) imm.hideSoftInputFromWindow(urlInput.getWindowToken(), 0);
                  webView.loadUrl(destino);
              }

              @Override
              public void onBackPressed() {
                  if (customView != null) {
                      webView.getWebChromeClient().onHideCustomView();
                  } else if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile and Sign Universal APK
        working-directory: ./nova-app
        run: |
          SDK_MGR=$(find $ANDROID_HOME -name "sdkmanager" | head -n 1)
          yes | $SDK_MGR --licenses > /dev/null 2>&1 || true
          gradle assembleDebug --no-daemon

          # Firma universal v1 + v2 para que BlueStacks lo instale sin dar error
          keytool -genkey -v -keystore nova.keystore -alias nova -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=NOVA, OU=Dev, O=NOVA, L=BA, S=BA, C=AR"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          $APKSIGNER sign --ks nova.keystore --ks-pass pass:123456 --key-pass pass:123456 --v1-signing-enabled true --v2-signing-enabled true app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Browser-APK
          path: nova-app/app/build/outputs/apk/debug/app-debug.apk
