<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA Browser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: radial-gradient(circle at top, #1e1e2e 0%, #11111b 100%);
      color: #cdd6f4; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px;
    }
    .logo {
      font-size: 46px; font-weight: 900; letter-spacing: 3px;
      background: linear-gradient(90deg, #89b4fa, #cba6f7);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .subtitle { color: #a6adc8; font-size: 14px; margin-bottom: 28px; }
    
    .search-box {
      width: 100%; max-width: 520px; display: flex; gap: 8px; margin-bottom: 36px;
    }
    .search-box input {
      flex: 1; padding: 14px 20px; border-radius: 28px; border: 1px solid #313244;
      background: #181825; color: #fff; font-size: 15px; outline: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .search-box input:focus { border-color: #89b4fa; }
    .search-box button {
      padding: 0 24px; border-radius: 28px; border: none;
      background: #89b4fa; color: #11111b; font-weight: bold; font-size: 15px; cursor: pointer;
    }

    .grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
      width: 100%; max-width: 520px;
    }
    .card {
      background: rgba(30, 30, 46, 0.75); border: 1px solid #313244; border-radius: 16px;
      padding: 18px 10px; text-align: center; text-decoration: none; color: #cdd6f4;
      transition: transform 0.15s, border-color 0.15s;
    }
    .card:active, .card:hover { transform: scale(0.97); border-color: #89b4fa; background: #313244; }
    .icon { font-size: 28px; margin-bottom: 8px; display: block; }
    .label { font-size: 13px; font-weight: 600; }
  </style>
</head>
<body>

  <div class="logo">NOVA</div>
  <div class="subtitle">Motor Web Nativo sin restricciones</div>

  <form class="search-box" onsubmit="buscar(event)">
    <input type="text" id="q" placeholder="Busca en Google o escribe una URL...">
    <button type="submit">Ir</button>
  </form>

  <div class="grid">
    <a class="card" href="https://www.youtube.com">
      <span class="icon">▶️</span><span class="label">YouTube</span>
    </a>
    <a class="card" href="https://www.google.com">
      <span class="icon">🔍</span><span class="label">Google</span>
    </a>
    <a class="card" href="https://www.twitch.tv">
      <span class="icon">🟣</span><span class="label">Twitch</span>
    </a>
    <a class="card" href="https://www.reddit.com">
      <span class="icon">🟠</span><span class="label">Reddit</span>
    </a>
    <a class="card" href="https://es.wikipedia.org">
      <span class="icon">📚</span><span class="label">Wikipedia</span>
    </a>
    <a class="card" href="https://github.com">
      <span class="icon">🐙</span><span class="label">GitHub</span>
    </a>
  </div>

  <script>
    function buscar(e) {
      e.preventDefault();
      let val = document.getElementById('q').value.trim();
      if (!val) return;
      if (val.startsWith('http://') || val.startsWith('https://')) {
        window.location.href = val;
      } else if (val.includes('.') && !val.includes(' ')) {
        window.location.href = 'https://' + val;
      } else {
        window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(val);
      }
    }
  </script>
</body>
</html>
